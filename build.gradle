plugins {
    id 'java'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '7.0.17'
}

def smokeTest = providers.gradleProperty('picklecraftSmokeTest').isPresent()
if (smokeTest) {
    sourceSets.main.java.srcDir('src/dev/java')
}

group = 'io.github.gabooz'
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

minecraft {
    runs {
        configureEach {
            // Keep development saves and logs under this project.
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            args '--mixin.config', 'picklecraft.mixins.json'
        }
        register('client') {
            if (smokeTest) {
                workingDir = layout.buildDirectory.dir('playtest').get()
                systemProperty 'picklecraft.smokeTest', 'true'
            }
            // The offline skin table selects wide Steve for this profile ID.
            args '--username', 'Steve', '--uuid', '00000000-0000-4000-8000-00000000000d'
        }
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

// Forge's development scanner discovers a mod from one output directory.
sourceSets.main.output.resourcesDir = layout.buildDirectory.dir('classes/java/main').get().asFile

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/dev/**'
    manifest.attributes('MixinConfigs': 'picklecraft.mixins.json')
}

tasks.named('processResources') {
    // Keep the packaged mod metadata in sync with the build's pinned versions.
    def metadata = [version: project.version, minecraft: minecraft_version, forge: forge_version]
    inputs.properties(metadata)
    filesMatching('META-INF/mods.toml') {
        expand(metadata)
    }
}
